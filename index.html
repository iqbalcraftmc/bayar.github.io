<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        img { width: 100%; max-width: 260px; border-radius: 10px; border: 1px solid #ddd; margin: 10px 0; }
        .price { font-size: 22px; font-weight: bold; color: #d63384; margin: 5px 0; }
        .info { font-size: 13px; color: #666; }
        .error-box { background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; border: 1px solid #ffeeba; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h3 id="pageTitle" style="margin-top:0;">Selesaikan Pembayaran</h3>

    <!-- Tampilan Jika Ada Data Transaksi -->
    <div id="paymentContent">
        <img id="qrisDisplay" src="" alt="QRIS Code">
        <div class="price" id="totalDisplay">Rp 0</div>
        <p class="info">Silakan <strong>Screenshot</strong> gambar di atas & scan via aplikasi DANA, OVO, GoPay, ShopeePay, atau M-Banking.</p>
    </div>

    <!-- Tampilan Jika Dibuka Langsung Tanpa Data -->
    <div id="noDataBox" style="display: none;">
        <div class="error-box">
            ⚠️ <strong>Belum Ada Transaksi</strong><br>
            Link ini dibuka tanpa data pembayaran. Silakan minta link pembayaran dari penjual.
        </div>
    </div>
</div>

<script>
    // Membaca data dari parameter URL (?image=...&total=...)
    const urlParams = new URLSearchParams(window.location.search);
    const imageParam = urlParams.get('image');
    const totalParam = urlParams.get('total');

    if (imageParam && totalParam) {
        // Jika data transaksi lengkap
        document.getElementById('qrisDisplay').src = decodeURIComponent(imageParam);
        document.getElementById('totalDisplay').innerText = "Rp " + Number(totalParam).toLocaleString('id-ID');
        document.getElementById('paymentContent').style.display = 'block';
        document.getElementById('noDataBox').style.display = 'none';
    } else {
        // Jika dibuka langsung tanpa data
        document.getElementById('paymentContent').style.display = 'none';
        document.getElementById('noDataBox').style.display = 'block';
        document.getElementById('pageTitle').innerText = "Halaman Pembayaran";
    }
</script>

</body>
</html>
