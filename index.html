<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran QRIS</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        img { width: 100%; border-radius: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Selesaikan Pembayaran</h3>
        <!-- Gambar QRIS akan muncul di sini -->
        <img id="qrisDisplay" src="" alt="QRIS">
        <p>Total: <strong id="totalDisplay"></strong></p>
        <p style="font-size: 12px; color: grey;">Silakan Screenshot & Scan di aplikasi pembayaranmu.</p>
    </div>

    <script>
        // Otomatis mengambil data dari URL link yang dikirim via WA
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('qrisDisplay').src = urlParams.get('image');
        document.getElementById('totalDisplay').innerText = urlParams.get('total');
    </script>
</body>
</html>
