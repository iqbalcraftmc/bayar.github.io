<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagihan QRIS</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        img { width: 100%; max-width: 260px; border-radius: 10px; border: 1px solid #ddd; margin: 10px 0; }
        .price { font-size: 22px; font-weight: bold; color: #d63384; margin: 5px 0; }
        .status-badge { padding: 8px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-bottom: 10px; background: #fff3cd; color: #856404; }
        .badge-paid { background: #d4edda !important; color: #155724 !important; font-size: 16px; }
        .info { font-size: 13px; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top:0;">💳 Tagihan QRIS</h3>

    <div id="paymentContent">
        <!-- Badge Status Jelas -->
        <div id="statusText" class="status-badge">🟡 Menunggu Pembayaran</div>

        <img id="qrisDisplay" src="" alt="QRIS Code">
        <div class="price" id="totalDisplay">Rp 0</div>
        <p class="info" id="instructions">Silakan <strong>Screenshot</strong> gambar di atas & scan via DANA, OVO, GoPay, ShopeePay, atau M-Banking.</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const imageParam = urlParams.get('image');
    const totalParam = urlParams.get('total');
    const invParam = urlParams.get('inv');
    const apiKey = "SKY_be1b80ec1d164337";

    if (imageParam && totalParam) {
        document.getElementById('qrisDisplay').src = decodeURIComponent(imageParam);
        document.getElementById('totalDisplay').innerText = "Rp " + Number(totalParam).toLocaleString('id-ID');
        
        // Cek status otomatis setiap 5 detik di layar pembeli
        if (invParam) {
            setInterval(async () => {
                try {
                    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(`https://api.sairibot.my.id/api/invoice/status?apikey=${apiKey}&invoice_id=${invParam}`)}`);
                    const data = await res.json();
                    const status = (data.status || data.data?.status || "").toLowerCase();

                    if (status === 'paid' || status === 'success') {
                        const badge = document.getElementById('statusText');
                        badge.className = 'status-badge badge-paid';
                        badge.innerText = '🟢 PEMBAYARAN LUNAS!';
                        document.getElementById('instructions').innerText = 'Terima kasih, pembayaran kamu telah diterima.';
                        document.getElementById('qrisDisplay').style.display = 'none'; // Sembunyikan QRIS jika sudah lunas
                    }
                } catch(e) {}
            }, 5000);
        }
    }
</script>
</body>
</html>
